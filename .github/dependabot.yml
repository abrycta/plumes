# Dependency updates (Dependabot, MAINTAINING.md rule 24). Weekly version updates: minor and patch grouped into
# one PR per ecosystem and directory, at most 2 open. Security fixes come as their own grouped PR (repo setting:
# Dependabot security updates).
# Majors of react, react-dom, vite and maplibre-gl are upgraded by hand; @abrycta/* (Akari) only through the
# per-release upgrade PR (rule 16).
version: 2
registries:
  # @abrycta/akari comes from GitHub Packages. Dependabot secret DEPENDABOT_PACKAGES_TOKEN: a classic
  # personal access token with read:packages only.
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    # Dependabot needs the scope (or a committed .npmrc); without it every npm job fails with private_registry_config_not_found.
    scope: "@abrycta"
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: npm
    directories: ["/web"]
    registries: [github-packages]
    schedule:
      { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "@abrycta/*"
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) has no JS API yet, so typescript-eslint (peer <6.1) cannot
      # run on it. Stay on 6.x until typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI and the deploys run Node 24: keep @types/node on 24.x so the types match the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directories: ["/pipeline"]
    schedule:
      { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      uv:
        applies-to: version-updates
        update-types: [minor, patch]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # The private kit is pinned to a release tag and moved by hand (DATA-ARCHIVING.md).
      - dependency-name: archivekit

  - package-ecosystem: maven
    directories: ["/api"]
    schedule:
      { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      maven:
        applies-to: version-updates
        update-types: [minor, patch]
      maven-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/api"]
    schedule:
      { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      docker:
        applies-to: version-updates
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        update-types: [minor, patch]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
