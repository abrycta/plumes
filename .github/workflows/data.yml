name: Data
# Weekly delta and manual runs (DATA-PLAN §7): fetch -> crawl deltas -> Earth Engine (budgeted) -> read models + checks
# -> adopt new bundles into abrycta/plumes-archive -> publish (GitHub Pages, then the Hugging Face mirror).
# Earth Engine steps never run while a Lights data run is in progress, and stop at Plumes' cap (50 EECU-h a month, 10 a run).
on:
  schedule: [{ cron: "0 18 * * 6" }]   # Sundays 02:00 PHT
  workflow_dispatch:
    inputs:
      ee: { description: "Run Earth Engine steps", type: boolean, default: true }
      publish: { description: "Publish if checks pass", type: boolean, default: true }
permissions: { contents: write, actions: read }
concurrency: { group: data, cancel-in-progress: false }
jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ARCHIVE_READ_TOKEN: ${{ secrets.ARCHIVE_READ_TOKEN }}
    steps:
      - id: token
        run: |
          if [ -z "$ARCHIVE_READ_TOKEN" ]; then
            # a scheduled run without it would end green and the data would silently stop updating: fail (audit P14)
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error title=data run failed::ARCHIVE_READ_TOKEN is not set; the private archivekit and the archived state can't be read"; exit 1
            fi
            echo "::notice title=data run skipped::ARCHIVE_READ_TOKEN is not set yet; the private archivekit and the archived state can't be read."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1 }
      - if: steps.token.outputs.ok == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true, cache-dependency-glob: pipeline/uv.lock }
      - name: Install
        if: steps.token.outputs.ok == 'true'
        working-directory: pipeline
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
          git config --global url."https://x-access-token:${ARCHIVE_READ_TOKEN}@github.com/abrycta/data-archive-kit".insteadOf "https://github.com/abrycta/data-archive-kit"
          uv sync --locked --group sources --group ee --group era5 --group publish
      - name: Lights guard
        id: lights
        if: steps.token.outputs.ok == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh run list -R abrycta/lgu-lights --workflow data.yml --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$n" != "0" ]; then echo "::warning title=Earth Engine skipped::a Lights data run is in progress"; echo "ee=false" >> "$GITHUB_OUTPUT";
          else echo "ee=${{ github.event_name == 'schedule' || inputs.ee }}" >> "$GITHUB_OUTPUT"; fi
      - name: Restore state (previous version, EE ledger, crawl records)
        if: steps.token.outputs.ok == 'true'
        working-directory: pipeline
        env: { GH_TOKEN: "${{ secrets.ARCHIVE_READ_TOKEN }}" }
        run: uv run python -m plumes.state restore
      - name: Fetch file sources (archivekit)
        if: steps.token.outputs.ok == 'true'
        working-directory: pipeline
        run: uv run python -m plumes.sources
      - name: Crawl deltas
        # Each crawler is its own stage (audit P7): a failing source keeps its restored records, warns, opens its
        # "stage <name>" health issue in the archive repo, and the run goes on; the build's checks still gate publishing.
        if: steps.token.outputs.ok == 'true'
        working-directory: pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          stage() { uv run python -m plumes.stage "$@"; }
          stage wp plumes.crawl.wp
          stage lava-index plumes.crawl.lava index --since auto
          stage lava-fetch plumes.crawl.lava fetch
          stage vaac plumes.crawl.vaac --since auto
          stage firms plumes.firms
          stage thermal-n20 plumes.thermal_n20
          # needed by the build: without them it fails, so they stay hard steps
          test -f data/raw/nasa-msvolso2l4/philippines.json || uv run python -m plumes.nasa
          test -f data/raw/cod-ab/phl_admin3.csv || uv run python -m plumes.codab
      - name: Earth Engine (new months only)
        if: steps.token.outputs.ok == 'true' && steps.lights.outputs.ee == 'true'
        working-directory: pipeline
        env: { EE_SA_KEY: "${{ secrets.EE_SA_KEY }}" }
        run: |
          uv run python -m plumes.stage ee-so2 plumes.ee_series so2
          uv run python -m plumes.stage ee-fire plumes.ee_series fire --start 2013-01
      - name: Build read models and run the checks
        if: steps.token.outputs.ok == 'true'
        working-directory: pipeline
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          # next-version reads the gh-pages branch and fails when latest.json is unreadable while versions exist (audit P3)
          v=$(uv run python -m plumes.state next-version)
          uv run python -m plumes.readmodels --version "$v"
      - name: List the built version's files
        id: built
        if: always() && steps.token.outputs.ok == 'true'
        working-directory: pipeline/data/build/site
        run: |
          v=$(find . -maxdepth 1 -type d -name 'v*' | sed 's#^\./##' | sort -V | tail -n 1)
          if [ -z "$v" ]; then echo "::notice title=no version built::nothing to list"; exit 0; fi
          echo "dir=pipeline/data/build/site/$v" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          {
            echo "### Built $v: $(find "$v" -type f | wc -l) files, $(du -sb "$v" | cut -f1) bytes"
            echo
            echo '| bytes | file |'
            echo '|---:|---|'
            (cd "$v" && find . -type f -printf '%s\t%P\n' | sort -k2) | awk -F'\t' '{print "| " $1 " | " $2 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the built version (7 days)
        if: always() && steps.built.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-${{ steps.built.outputs.version }}-run${{ github.run_id }}
          path: ${{ steps.built.outputs.dir }}
          retention-days: 7
          if-no-files-found: ignore
      - name: Adopt new bundles into the archive
        # before Publish, so a published version's crawled inputs are always in the archive (audit H1); a trial run
        # (publish=false) publishes nothing, so it adopts nothing either
        if: steps.token.outputs.ok == 'true' && (github.event_name == 'schedule' || inputs.publish)
        working-directory: pipeline
        env: { GH_TOKEN: "${{ secrets.ARCHIVE_WRITE_TOKEN }}" }
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error title=adoption failed::ARCHIVE_WRITE_TOKEN is not set; a scheduled run never publishes inputs the archive does not hold"; exit 1
            fi
            echo "::notice title=adoption skipped::ARCHIVE_WRITE_TOKEN is not set"; exit 0
          fi
          uv run python -m plumes.adopt --changed-only
      - name: Publish
        if: steps.token.outputs.ok == 'true' && (github.event_name == 'schedule' || inputs.publish)
        working-directory: pipeline
        # GITHUB_TOKEN: the gh-pages clone is a separate repository the checkout's credentials don't reach (audit P1)
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          git config --global user.name Kurt
          git config --global user.email 73582015+abrycta@users.noreply.github.com
          uv run python -m plumes.publish --version "$(uv run python -m plumes.state built-version)" --pages --hf
