name: API
# The Java read API (api/): tests on every change; on main, the GraalVM native image is built, pushed to the private
# GHCR package ghcr.io/abrycta/plumes-api and deployed to Render (free plan) through the Render API. Nightly: a contract
# check of the live API through the edge cache (DATA-PLAN §8: one wake a day, no pinger).
on:
  push:
    branches: [main]
    paths: ["api/**", "contracts/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "contracts/**", ".github/workflows/api.yml"]
  schedule:
    - cron: "40 18 * * *" # 02:40 PHT
  workflow_dispatch:
    inputs:
      deploy: { description: "Build the native image and deploy", type: boolean, default: false }
permissions: { contents: read }
# main: a running build/deploy is never cancelled (runs queue; a newer pending run replaces an older pending one
# and deploys the newer commit, which includes it). Branches and PRs cancel superseded runs.
concurrency:
  group: api-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  IMAGE: ghcr.io/abrycta/plumes-api

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        # Postgres 18 + PostGIS 3.6, as on Neon.
        image: postgis/postgis:18-3.6
        env: { POSTGRES_USER: plumes, POSTGRES_PASSWORD: plumes, POSTGRES_DB: plumes }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plumes -d plumes" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://plumes:plumes@localhost:5432/plumes?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17", cache: maven, cache-dependency-path: api/pom.xml }
      - name: Migrate (dbmate)
        run: |
          docker run --rm --network host -v "$PWD/api/db:/db" -e DATABASE_URL="$TEST_DATABASE_URL" \
            ghcr.io/amacneil/dbmate:2.37 --migrations-dir /db/migrations --no-dump-schema --wait up
      - name: Unit, contract and PostGIS integration tests (Java 17)
        working-directory: api
        run: mvn -B -ntp verify

  image:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # The native compile itself is not incremental (about 5 minutes); the Maven dependency layer is cached.
      - name: Build the native image and push it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api-native
          cache-to: type=gha,scope=api-native,mode=max
          provenance: false
      - name: Image size
        run: |
          docker pull -q "$IMAGE:${{ github.sha }}"
          docker image inspect "$IMAGE:${{ github.sha }}" --format 'image {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Render (free plan service, pinned to this commit's image)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE" ]; then echo "::notice::Render not configured; image pushed only"; exit 0; fi
          curl -fsS -X POST "https://api.render.com/v1/services/$SERVICE/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE:${{ github.sha }}\"}" -o /dev/null -w "Render deploy HTTP %{http_code}\n"

  live-contract:
    # One wake a day: the live volcano list and Taal's file through the edge validate against the read-model schemas.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: ${{ vars.PLUMES_SITE || 'https://plumes.krtmtthw.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Fetch through the edge (waits out a cold start)
        run: |
          get() {
            for _ in $(seq 1 12); do
              code=$(curl -s -o "$2" -w '%{http_code}' "$SITE/api$1")
              [ "$code" = 200 ] && return 0
              echo "$1: HTTP $code, retrying"; sleep 10
            done
            return 1
          }
          get /v1/volcanoes volcanoes.json
          id=$(python3 -c 'import json; f=[x for x in json.load(open("volcanoes.json"))["features"]]; print(next((x["id"] for x in f if x["id"]=="taal"), f[0]["id"]))')
          get "/v1/volcanoes/$id" volcano.json
      - name: Validate against contracts/schemas
        run: |
          uv run --no-project --with jsonschema==4.25.1 python - <<'PY'
          import json, pathlib, jsonschema, referencing
          base = "https://plumes.krtmtthw.dev/schemas/"
          d = pathlib.Path("contracts/schemas")
          reg = referencing.Registry().with_resources(
              (base + p.name, referencing.Resource.from_contents(json.loads(p.read_text()))) for p in d.glob("*.json"))
          for schema, doc in (("volcanoes.schema.json", "volcanoes.json"), ("volcano.schema.json", "volcano.json")):
              v = jsonschema.Draft202012Validator(json.loads((d / schema).read_text()), registry=reg)
              errors = list(v.iter_errors(json.loads(pathlib.Path(doc).read_text())))
              for e in errors[:10]: print(doc, list(e.absolute_path), e.message[:200])
              assert not errors, f"{doc}: {len(errors)} schema errors"
              print(doc, "valid against", schema)
          PY
