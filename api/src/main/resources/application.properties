# Configuration comes from the environment: DATABASE_URL (postgres:// URL; see PlumesApplication), PORT,
# PLUMES_EDGE_SECRET, PLUMES_LOG_LEVEL. Nothing here is a secret.
spring.application.name=plumes-api
spring.main.banner-mode=off
spring.jmx.enabled=false
plumes.impl-version=@project.version@
plumes.commit=${PLUMES_COMMIT:${RENDER_GIT_COMMIT:unknown}}
plumes.edge-secret=${PLUMES_EDGE_SECRET:}

server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=never
# gzip: Render bills the bytes it sends (DATA-PLAN 8).
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,application/geo+json,application/problem+json,application/yaml
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false

# Neon free scales to zero: a small pool, no idle connections kept (they would keep the compute awake), and enough
# patience for a suspended compute to resume (a few seconds) without failing startup.
spring.datasource.hikari.pool-name=plumes
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.read-only=true
spring.sql.init.mode=never
# Local default; DATABASE_URL overrides it.
spring.datasource.url=jdbc:postgresql://localhost:5432/plumes
spring.datasource.username=plumes
spring.datasource.password=plumes

logging.level.root=${PLUMES_LOG_LEVEL:info}
logging.level.com.zaxxer.hikari=warn
