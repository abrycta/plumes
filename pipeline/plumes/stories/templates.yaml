# Story sentence catalogue (STORIES-PLAN §B3). Fixed EN and JA templates; every {placeholder} is typed and filled from a
# sourced value, so no free text from any source can enter a sentence. A sentence renders only when every placeholder
# resolves (§B4). Digits outside placeholders must be listed in `constants` (the unsourced-number check, §B6.4).
#
# Fields: id; steps (where it may appear); family (the fact family it counts towards; `context` does not count);
# source (registry ids); types (placeholder -> type); en, ja; variants (first match wins: `one: x` when x == 1,
# `zero: x` when x == 0, `single: span` when a span is one day, `cont: <family>` when the previous sentence in the step is of that family); constants.
#
# Types: date, span (two dates, "from … to …"), dash (two dates, "12–13 January 2020"), month, int, num, level, fl,
# share, time, year, km, sensor, dir, agency, name. sensor/dir/agency are closed lists in render.py, name is the
# volcano name from Plumes' own crosswalk.
version: 1

templates:
  # ------------------------------------------------------------ PHIVOLCS bulletins
  - id: ALERT-HELD
    steps: [before]
    family: alert
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { level: level, span: span }
    en: "PHIVOLCS bulletins reported Alert Level {level} on every day from {span}, as reported by PHIVOLCS."
    ja: "PHIVOLCSの火山情報は{span}毎日、警戒レベル{level}を発表していた（PHIVOLCS発表）。"

  - id: ALERT-HELD-GAPS
    steps: [before]
    family: alert
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { level: level, n: int, span: span }
    en: "PHIVOLCS bulletins reported Alert Level {level} on each of the {n} days with a bulletin from {span}, as reported by PHIVOLCS."
    ja: "PHIVOLCSの火山情報は{span}、発表のあった{n}日すべてで警戒レベル{level}だった（PHIVOLCS発表）。"

  - id: ALERT-RAISED
    steps: [before, onset, course, after]
    family: alert
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { a: level, b: level, date: date, time: time }
    en: "PHIVOLCS raised the alert from level {a} to level {b} on {date} in its {time} bulletin, as reported by PHIVOLCS."
    ja: "PHIVOLCSは{date}{time}の火山情報で警戒レベルを{a}から{b}に引き上げた（PHIVOLCS発表）。"

  - id: ALERT-RAISED-DAY
    steps: [before, onset, course, after]
    family: alert
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { a: level, b: level, date: date }
    en: "PHIVOLCS raised the alert from level {a} to level {b} on {date}, as reported by PHIVOLCS."
    ja: "PHIVOLCSは{date}、警戒レベルを{a}から{b}に引き上げた（PHIVOLCS発表）。"

  - id: ALERT-LOWERED
    steps: [course, after]
    family: alert
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { a: level, b: level, date: date }
    en: "PHIVOLCS lowered the alert from level {a} to level {b} on {date}, as reported by PHIVOLCS."
    ja: "PHIVOLCSは{date}、警戒レベルを{a}から{b}に引き下げた（PHIVOLCS発表）。"

  # A level change across days without a bulletin: the record shows both days, not the day of the change.
  - id: ALERT-CHANGED-GAP
    steps: [before, onset, course, after]
    family: alert
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { a: level, d0: date, b: level, date: date }
    en: "PHIVOLCS bulletins reported Alert Level {a} on {d0} and Alert Level {b} on {date}, as reported by PHIVOLCS."
    ja: "PHIVOLCSの火山情報は{d0}に警戒レベル{a}、{date}に警戒レベル{b}を発表した（PHIVOLCS発表）。"

  - id: BUL-VEQ-MAX
    steps: [before, onset, course, after]
    family: bulletin
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { n: int, span: span }
    constants: ["1日"]
    en: "PHIVOLCS bulletins counted up to {n} volcanic earthquakes in a day from {span}, as reported by PHIVOLCS."
    ja: "PHIVOLCSの火山情報は{span}に1日最大{n}回の火山性地震を記録した（PHIVOLCS発表）。"
    variants:
      - when: { zero: n }
        en: "PHIVOLCS bulletins counted no volcanic earthquake from {span}, as reported by PHIVOLCS."
        ja: "PHIVOLCSの火山情報は{span}、火山性地震を記録しなかった（PHIVOLCS発表）。"
      - when: { single: span, one: n }
        en: "PHIVOLCS bulletins counted {n} volcanic earthquake on {span}, as reported by PHIVOLCS."
        ja: "PHIVOLCSの火山情報は{span}に{n}回の火山性地震を記録した（PHIVOLCS発表）。"
      - when: { single: span }
        en: "PHIVOLCS bulletins counted {n} volcanic earthquakes on {span}, as reported by PHIVOLCS."
        ja: "PHIVOLCSの火山情報は{span}に{n}回の火山性地震を記録した（PHIVOLCS発表）。"
      - when: { one: n }
        en: "PHIVOLCS bulletins counted up to {n} volcanic earthquake in a day from {span}, as reported by PHIVOLCS."
        ja: "PHIVOLCSの火山情報は{span}に1日最大{n}回の火山性地震を記録した（PHIVOLCS発表）。"

  - id: BUL-SO2FLUX-MAX
    steps: [before, onset, course, after]
    family: bulletin
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { x: int, span: span }
    constants: ["1日"]
    en: "PHIVOLCS measured SO₂ emissions of up to {x} tonnes a day from {span}, as reported by PHIVOLCS."
    ja: "PHIVOLCSは{span}に最大1日{x}トンのSO₂放出量を測定した（PHIVOLCS発表）。"
    variants:
      - when: { single: span }
        en: "PHIVOLCS measured SO₂ emissions of {x} tonnes a day on {span}, as reported by PHIVOLCS."
        ja: "PHIVOLCSは{span}に1日{x}トンのSO₂放出量を測定した（PHIVOLCS発表）。"

  - id: BUL-PLUME-MAX
    steps: [onset, course]
    family: bulletin
    source: [phivolcs-bulletins, phivolcs-lava-bulletins]
    types: { m: int, span: span }
    en: "PHIVOLCS reported plumes up to {m} m above the crater from {span}, as reported by PHIVOLCS."
    ja: "PHIVOLCSは{span}に火口上最大{m} mの噴煙を報告した（PHIVOLCS発表）。"
    variants:
      - when: { single: span }
        en: "PHIVOLCS reported a plume {m} m above the crater on {span}, as reported by PHIVOLCS."
        ja: "PHIVOLCSは{span}に火口上{m} mの噴煙を報告した（PHIVOLCS発表）。"

  # ------------------------------------------------------------ satellite SO₂
  - id: SO2-BASELINE
    steps: [before]
    family: so2
    source: [s5p-offl-so2]
    types: { sensor: sensor, r: km, med: num, span: span, n: int, N: int }
    en: "The {sensor} SO₂ column within {r} km had a median of {med} µmol/m² from {span} ({n} of {N} days with a clear view)."
    ja: "{r} km圏の{sensor} SO₂カラム量は{span}の中央値が{med} µmol/m²だった（{N}日中{n}日が観測可能）。"

  - id: SO2-BASELINE-OMI
    steps: [before]
    family: so2
    source: [omi-omso2e]
    types: { med: num, span: span, n: int, N: int }
    constants: ["50 km"]
    en: "The OMI SO₂ column in the 50 km box had a median of {med} DU from {span} ({n} of {N} days with a clear view)."
    ja: "50 km範囲のOMI SO₂カラム量は{span}の中央値が{med} DUだった（{N}日中{n}日が観測可能）。"

  - id: SO2-PEAK
    steps: [onset, course]
    family: so2
    source: [s5p-offl-so2]
    types: { sensor: sensor, r: km, x: num, date: date, cov: share }
    en: "The {sensor} SO₂ column within {r} km reached {x} µmol/m² on {date}, the highest in this period (coverage {cov})."
    ja: "{r} km圏の{sensor} SO₂カラム量は{date}に{x} µmol/m²で、この期間の最大だった（被覆率{cov}）。"

  - id: SO2-PEAK-OMI
    steps: [onset, course]
    family: so2
    source: [omi-omso2e]
    types: { x: num, date: date, cov: share }
    constants: ["50 km"]
    en: "The OMI SO₂ column in the 50 km box reached {x} DU on {date}, the highest in this period (coverage {cov})."
    ja: "50 km範囲のOMI SO₂カラム量は{date}に{x} DUで、この期間の最大だった（被覆率{cov}）。"

  # ------------------------------------------------------------ USGS earthquakes
  - id: EQ-QUIET
    steps: [before]
    family: usgs
    source: [usgs-comcat-ph-1900-2009, usgs-comcat-ph-2010]
    types: { d1: date, d2: date, n: int, m: num }
    constants: ["30 km"]
    en: "The USGS catalogue lists no earthquake within 30 km after {d1} until {d2}, when it lists {n}, the largest M{m}."
    ja: "USGSのカタログには{d1}の後、{d2}まで30 km圏の地震がなく、同日には{n}回（最大M{m}）が記録されている。"
    variants:
      - when: { one: n }
        en: "The USGS catalogue lists no earthquake within 30 km after {d1} until {d2}, when it lists {n}, of M{m}."
        ja: "USGSのカタログには{d1}の後、{d2}まで30 km圏の地震がなく、同日には{n}回（M{m}）が記録されている。"

  - id: EQ-COUNT
    steps: [before, onset, course, after]
    family: usgs
    source: [usgs-comcat-ph-1900-2009, usgs-comcat-ph-2010]
    types: { n: int, span: span, m: num }
    constants: ["30 km"]
    en: "The USGS catalogue lists {n} earthquakes within 30 km from {span}, the largest M{m}."
    ja: "USGSのカタログには{span}に30 km圏の地震が{n}回記録されており、最大はM{m}だった。"
    variants:
      - when: { one: n }
        en: "The USGS catalogue lists {n} earthquake within 30 km from {span}, of M{m}."
        ja: "USGSのカタログには{span}に30 km圏の地震が{n}回記録されており、M{m}だった。"

  - id: EQ-NONE
    steps: [before, onset, course, after]
    family: usgs
    source: [usgs-comcat-ph-1900-2009, usgs-comcat-ph-2010]
    types: { span: span }
    constants: ["30 km"]
    en: "The USGS catalogue lists no earthquake within 30 km from {span}."
    ja: "USGSのカタログには{span}、30 km圏の地震の記録がない。"

  # ------------------------------------------------------------ Tokyo VAAC
  - id: VAAC-MAX
    steps: [onset, course]
    family: vaac
    source: [vaac-tokyo-advisories]
    types: { fl: fl, date: date }
    en: "Tokyo VAAC observed ash up to {fl} on {date}."
    ja: "東京VAACは{date}に最高{fl}の火山灰を観測した。"

  - id: VAAC-COUNT
    steps: [onset, course]
    family: vaac
    source: [vaac-tokyo-advisories]
    types: { n: int, span: span }
    en: "Tokyo VAAC issued {n} ash advisories from {span}."
    ja: "東京VAACは{span}に{n}件の火山灰情報を発表した。"
    variants:
      - when: { one: n }
        en: "Tokyo VAAC issued {n} ash advisory from {span}."
        ja: "東京VAACは{span}に{n}件の火山灰情報を発表した。"

  # ------------------------------------------------------------ thermal
  - id: HEAT-DAYS
    steps: [before, onset, course, after]
    family: thermal
    source: [modis-mod14a1, viirs-vnp14a1]
    types: { sensor: sensor, n: int, span: span, x: num, date: date }
    constants: ["15 km"]
    en: "{sensor} detected heat within 15 km on {n} days from {span}, the strongest {x} MW on {date}."
    ja: "{sensor}は{span}の{n}日、15 km圏で熱異常を検出し、最大は{date}の{x} MWだった。"
    variants:
      - when: { one: n }
        en: "{sensor} detected heat within 15 km on {n} day from {span}: {x} MW on {date}."
        ja: "{sensor}は{span}の{n}日、15 km圏で熱異常を検出し、{date}の{x} MWだった。"

  # ------------------------------------------------------------ GVP and NASA records of the eruption
  - id: GVP-VEI
    steps: [onset]
    family: vei
    source: [gvp-eruptions-ph]
    types: { vei: int }
    en: "GVP records the eruption as VEI {vei}."
    ja: "GVPはこの噴火をVEI {vei}としている。"

  - id: SO2-MASS
    steps: [onset]
    family: so2mass
    source: [nasa-msvolso2l4]
    types: { x: num, date: date }
    constants: ["MSVOLSO2L4"]
    en: "NASA's MSVOLSO2L4 record lists {x} kt of SO₂ for the eruption of {date}."
    ja: "NASAのMSVOLSO2L4は{date}の噴火のSO₂量を{x} ktとしている。"

  # ------------------------------------------------------------ DSWD DROMIC
  - id: DROMIC-AFFECTED
    steps: [after]
    family: dromic
    source: [dswd-dromic-reports]
    types: { n: int, date: date }
    en: "DSWD DROMIC reports counted {n} people affected by {date}."
    ja: "DSWD DROMIC報告は{date}までに{n}人の被災者を数えた。"

  - id: DROMIC-INSIDE-MAX
    steps: [course]
    family: dromic
    source: [dswd-dromic-reports]
    types: { n: int, date: date, k: int }
    en: "The most people in evacuation centres, {n}, were counted on {date}, according to DSWD DROMIC Report #{k}."
    ja: "DSWD DROMIC報告第{k}号によると、避難所にいた人は{date}の{n}人が最多だった。"

  # ------------------------------------------------------------ Smithsonian/USGS Weekly Reports (ST2). No extractor yet:
  # these templates are in the catalogue so the checks cover them; they render once the weekly-report source exists.
  - id: WEEKLY-ALERT
    steps: [before, onset, course, after]
    family: weekly
    source: [gvp-weekly-reports]
    types: { b: level, date: date }
    en: "PHIVOLCS raised the alert to level {b} on {date}, as reported by PHIVOLCS, via Smithsonian/USGS."
    ja: "PHIVOLCSは{date}に警戒レベルを{b}に引き上げた（PHIVOLCS発表、スミソニアン/USGS経由）。"

  - id: WEEKLY-EVAC
    steps: [course]
    family: weekly
    source: [gvp-weekly-reports]
    types: { n: int, date: date, agency: agency }
    en: "{n} people were in evacuation centres on {date}, as reported by {agency}, via Smithsonian/USGS."
    ja: "{date}には{n}人が避難所にいた（{agency}発表、スミソニアン/USGS経由）。"

  - id: WEEKLY-SO2
    steps: [before, onset, course, after]
    family: weekly
    source: [gvp-weekly-reports]
    types: { x: int, date: date }
    constants: ["1日"]
    en: "SO₂ emissions were {x} tonnes a day on {date}, as reported by PHIVOLCS, via Smithsonian/USGS."
    ja: "{date}のSO₂放出量は1日{x}トンだった（PHIVOLCS発表、スミソニアン/USGS経由）。"

  - id: WEEKLY-LAKE-GONE
    steps: [onset, course]
    family: weekly
    source: [gvp-weekly-reports]
    types: { week: dash }
    en: "Satellite images in the week of {week} showed that the Main Crater lake was gone, as reported by PHIVOLCS, via Smithsonian/USGS."
    ja: "{week}の衛星画像では主火口湖が消失していた（PHIVOLCS発表、スミソニアン/USGS経由）。"

  # ------------------------------------------------------------ NOAA NCEI HazEL
  - id: HAZEL-DEATHS
    steps: [after]
    family: hazel
    source: [noaa-hazel-volcanoes-ph]
    types: { n: int }
    en: "NOAA's Significant Volcanic Eruptions Database records {n} deaths for this eruption."
    ja: "NOAAの重要火山噴火データベースは、この噴火による死者を{n}人と記録している。"
    variants:
      - when: { one: n }
        en: "NOAA's Significant Volcanic Eruptions Database records {n} death for this eruption."
        ja: "NOAAの重要火山噴火データベースは、この噴火による死者を{n}人と記録している。"

  - id: HAZEL-HOUSES
    steps: [after]
    family: hazel
    source: [noaa-hazel-volcanoes-ph]
    types: { n: int }
    en: "NOAA's Significant Volcanic Eruptions Database records {n} houses destroyed by this eruption."
    ja: "NOAAの重要火山噴火データベースは、この噴火による全壊家屋を{n}棟と記録している。"
    variants:
      - when: { cont: hazel, one: n }
        en: "It records {n} house destroyed."
        ja: "全壊家屋は{n}棟と記録されている。"
      - when: { cont: hazel }
        en: "It records {n} houses destroyed."
        ja: "全壊家屋は{n}棟と記録されている。"
      - when: { one: n }
        en: "NOAA's Significant Volcanic Eruptions Database records {n} house destroyed by this eruption."
        ja: "NOAAの重要火山噴火データベースは、この噴火による全壊家屋を{n}棟と記録している。"

  - id: HAZEL-DAMAGE
    steps: [after]
    family: hazel
    source: [noaa-hazel-volcanoes-ph]
    types: { x: num }
    en: "NOAA's Significant Volcanic Eruptions Database records damage of about US${x} million from this eruption."
    ja: "NOAAの重要火山噴火データベースは、この噴火による被害額を約{x}百万米ドルと記録している。"
    variants:
      - when: { cont: hazel }
        en: "It records damage of about US${x} million."
        ja: "被害額は約{x}百万米ドルと記録されている。"

  # ------------------------------------------------------------ COMET deformation
  - id: DEFORM-LOS
    steps: [before, after]
    family: deformation
    source: [comet-licsbas]
    types: { x: num, dir: dir, span: span }
    constants: ["Sentinel-1"]
    en: "COMET's Sentinel-1 record shows {x} mm of movement {dir} the satellite along its line of sight from {span}."
    ja: "COMETのSentinel-1記録では、{span}に視線方向で{x} mm（衛星に{dir}向き）の変位があった。"

  # ------------------------------------------------------------ context (not counted towards the score)
  - id: RAIN-TOTAL
    steps: [before, onset, course, after]
    family: context
    rain: true
    source: [gpm-imerg-v07]
    types: { x: num, span: span }
    constants: ["15 km"]
    en: "GPM IMERG estimates {x} mm of rain within 15 km from {span}."
    ja: "GPM IMERGの推定では、{span}に15 km圏で{x} mmの雨が降った。"

  - id: RAIN-WETTEST
    steps: [course, after]
    family: context
    rain: true
    source: [gpm-imerg-v07]
    types: { date: date, x: num }
    en: "The wettest day in this period was {date}, with {x} mm."
    ja: "この期間で最も雨が多かったのは{date}で、{x} mmだった。"

  - id: IMAGE-CAPTION
    steps: [before, after]
    family: caption
    source: [s2-sr-harmonized, landsat-c2-l2]
    types: { sensor: sensor, date: date }
    en: "{sensor}, {date}"
    ja: "{sensor}、{date}"

  # ------------------------------------------------------------ titles and summary
  - id: TITLE
    family: title
    types: { name: name, month: month }
    en: "{name}, {month}"
    ja: "{name} {month}"

  - id: SUMMARY-ERUPTION
    family: title
    types: { date: date }
    en: "What the instruments recorded before, during and after the {date} eruption. A past record, not a hazard assessment."
    ja: "{date}の噴火の前後に観測機器が記録したこと。過去の記録であり、ハザード評価ではない。"

  - id: SUMMARY-UNREST
    family: title
    types: { date: date }
    en: "What the instruments recorded before, during and after the raised alert levels that began on {date}. A past record, not a hazard assessment."
    ja: "{date}に始まった警戒レベル引き上げの前後に観測機器が記録したこと。過去の記録であり、ハザード評価ではない。"

  - id: STEP-BEFORE
    family: title
    types: {}
    en: "Before"
    ja: "噴火前"
    variants:
      - when: { unrest: true }
        en: "Before"
        ja: "活動活発化の前"

  - id: STEP-AFTER
    family: title
    types: {}
    en: "After"
    ja: "噴火後"
    variants:
      - when: { unrest: true }
        en: "After"
        ja: "活動活発化の後"

  - id: STEP-DATES
    family: title
    types: { dates: dash }
    en: "{dates}"
    ja: "{dates}"

  # ------------------------------------------------------------ why lines (§B4): a missing record, never a zero
  - id: WHY-NO-BULLETINS
    family: why
    types: { volcano: name, date: date }
    en: "PHIVOLCS bulletins for these dates are not online; the online record for {volcano} starts on {date}."
    ja: "この期間のPHIVOLCS火山情報はオンラインで公開されていない（{volcano}の記録は{date}から）。"

  - id: WHY-BEFORE-INSTRUMENT
    family: why
    types: { sensor: sensor, date: date }
    en: "{sensor} began observing on {date}, after these dates."
    ja: "{sensor}の観測は{date}に始まり、この期間より後である。"

  - id: WHY-NO-VAAC
    family: why
    types: { volcano: name, year: year }
    en: "Tokyo VAAC's online list has no ash advisory for {volcano} in these dates (the list starts in {year})."
    ja: "東京VAACのオンライン一覧には、この期間の{volcano}に関する火山灰情報がない（一覧は{year}年から）。"

  - id: WHY-NO-DROMIC
    family: why
    types: {}
    en: "No DSWD DROMIC report was found for this event."
    ja: "このイベントに関するDSWD DROMIC報告は見つからなかった。"

  - id: WHY-NO-CLEAR-SCENE
    family: why
    types: {}
    constants: ["90日", "90 days", "Sentinel-2"]
    en: "No cloud-free Landsat or Sentinel-2 scene was found within 90 days."
    ja: "90日以内に雲のないLandsatまたはSentinel-2の画像が見つからなかった。"
