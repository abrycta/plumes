[project]
name = "plumes-pipeline"
version = "0.1.0"
description = "Plumes data pipeline: sources (archivekit), crawlers, Earth Engine reductions, read models"
authors = [{ name = "Kurt" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6",
    "jsonschema>=4.25",
    "referencing>=0.36",
    "lxml>=6",
    "python-docx>=1.2",
    "certifi>=2025.1",
]

[dependency-groups]
dev = ["ruff>=0.13", "pytest>=8.4"]
# archivekit (private kit, pinned tag): installing it needs ARCHIVE_READ_TOKEN in CI (DATA-ARCHIVING.md §6)
sources = ["archivekit"]
# Earth Engine reductions (GitHub Actions only)
ee = ["earthengine-api>=1.6"]
# Publishing to the Hugging Face mirror
publish = ["huggingface-hub>=0.35"]
# ERA5 range reads (ARCO-ERA5 Blosc blocks)
era5 = ["numpy>=2.3", "lz4>=4.4", "numcodecs>=0.15"]
# COMET LiCSBAS series and the deformation-velocity layer (plumes.comet)
comet = ["numpy>=2.3"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
archivekit = { git = "https://github.com/abrycta/data-archive-kit", rev = "v1.4.1" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["scripts/build_fixtures.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM115", "E501"]
