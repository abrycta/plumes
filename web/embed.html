<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The embed krtmtthw.dev frames: the national map stepping through the year before the latest eruption; see src/embed/. -->
    <script src="/theme-init.js" data-shared-cookie-domain="krtmtthw.dev"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="preload" href="/config.json" as="fetch" crossorigin="anonymous" />
    <!-- The published data host (config.json) and, for the embed, the basemap host: connect while the scripts load. -->
    <link rel="preconnect" href="https://krtmtthw.dev" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- Pre-load still: the project's kanji glyph, the same quiet tile as krtmtthw.dev's embed slots (Akari muted tokens),
      until the view is ready. Over the page until the first full frame is drawn (html[data-embed-ready]). -->
    <style>
      .glyph-seal {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: var(--muted);
        color: var(--muted-foreground);
        font-family: var(--font-heading);
        font-size: clamp(48px, 9vw, 80px);
        font-weight: 700;
        line-height: 1;
        pointer-events: none;
      }
      html[data-embed-ready] .glyph-seal {
        display: none;
      }
    </style>
    <title>Plumes (embed)</title>
  </head>
  <body>
    <div class="glyph-seal" aria-hidden="true" lang="ja">噴</div>
    <div id="root"></div>
    <script type="module" src="/src/embed/main.tsx"></script>
  </body>
</html>
