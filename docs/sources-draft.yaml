# yaml-language-server: $schema=../../data-archive-kit/schema/sources.schema.json
# Source registry DRAFT for Plumes (DECISIONS.md Q1/Q2, 2026-10-21): the 77 sources of the approved design canvas
# (core record plus nine passes), one entry per source, plus the PHIVOLCS channels and the Lights/Replay shared inputs.
# Format: archivekit, abrycta/data-archive-kit v1.1.0. Moves to pipeline/sources.yaml when the repo exists.
# Validate from the kit checkout (no install needed):
#   cd ../../data-archive-kit && uv run archivekit validate-registry --registry ../plumes/docs/sources-draft.yaml
#
# How to read an entry. The schema allows no extra fields, so each description carries, in this order:
#   [Mn] milestone (DATA-PLAN.md §9) | Publisher | Access (URL or API pattern) | Format | Size (per volcano / total;
#   [U] = estimate) | Auth (none; Earth Engine service account = the lgu-lights key `earth-engine-sa-key`, DECISIONS.md Q11;
#   Earthdata = the Keychain `earthdata-login`; a named free registration = Kurt's action).
# `licence` carries the verdict from LICENCES.md (open / open-with-conditions / noncommercial-only / link-only / paid)
# and `attribution` the text the publisher asks for. Secrets are never written here.
#
# Kinds: `file` = fetched by archivekit and archived; `remote-dataset` = reduced where it lives (Earth Engine, buckets)
# or too big to archive, >= 2 automatic links; `update-input` = read by the pipeline's own client (crawled pages,
# hand-downloaded files adopted as private archive releases, authenticated downloads). Rasters are never archived.
# PHIVOLCS: public pages only, every figure cited with its link, no bulk file published, no email (Q5 = ii).
# DECIDED (2026-10-21, DECISIONS.md Q30, Q31): Plumes uses 24 sources (25 with M1.1), query-in-place where possible:
# the 20 of NO-DOWNLOAD-ALTERNATIVES.md plus OMI SO2, MSVOLSO2L4, Landsat and Sentinel-1 (NASA-EE-CANDIDATES.md A1-A4),
# and Google Open Buildings Temporal (A5) at M1.1. They carry the comment `# chosen: true` under their id with the
# source number and milestone (27 entries: USGS and Landsat are each one source split in two). The schema allows no
# extra fields, so the mark is a comment. Every unmarked entry is out of scope (Q30) and kept as history.
version: 1
project: plumes

archive:
  repo: abrycta/plumes-archive
  token_env: ARCHIVE_READ_TOKEN          # fine-grained PAT: Contents read on kit + archive, Issues read/write on archive
  tag_format: "{id}-{date}"
  compression: zstd
  compression_level: auto

health:
  issue_label: source-health
  issue_title_prefix: "plumes source"
  issue_token_env: ARCHIVE_READ_TOKEN
  token_expiry_warn_days: 30
  token_expires: "2027-10-31"            # placeholder: set to the ARCHIVE_READ_TOKEN expiry when it is created
  user_agent: "plumes-pipeline/0.1 (+https://github.com/abrycta/plumes)"
  heartbeat_days: 14

sources:
  # =================================================================== CORE RECORD (M1)
  # ------------------------------------------------------------------ eruption history (Smithsonian GVP, WFS)
  - id: gvp-volcanoes-ph
    # chosen: true   # source 1 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] Smithsonian Global Volcanism Program, Volcanoes of the World: Holocene volcanoes with Country = Philippines
      (23 rows on 2026-10-21) as CSV from the GVP GeoServer WFS. Supplies GVP numbers, coordinates, elevation,
      type and last eruption year; the crosswalk to the 24 PHIVOLCS active volcanoes is a repo file.
      Access: webservices.volcano.si.edu WFS GetFeature (CSV or GeoJSON, CQL filter). Format: CSV. Size: under 100 kB.
      Auth: none. Photo fields carry individual credits and are not reused.
    kind: file
    format: csv
    filename: gvp-volcanoes-ph.csv
    local_path: data/raw/gvp/gvp-volcanoes-ph.csv
    licence: >-
      open-with-conditions: Smithsonian Terms of Use (non-commercial use with citation; the terms pages answered a
      Cloudflare challenge on 2026-10-21 and are to be re-read by hand, LICENCES.md); WFS GetCapabilities states
      Fees NONE and AccessConstraints NONE. Derived figures are shown with the citation; no copy is redistributed.
    attribution: >-
      Global Volcanism Program, 2026. [Database] Volcanoes of the World (v. 5.4.0; 7 Aug 2026). Distributed by
      Smithsonian Institution, compiled by Venzke, E. https://doi.org/10.5479/si.GVP.VOTW5-2026.5.4 (use the current
      version string), linked to https://volcano.si.edu/
    cadence: database releases a few times a year
    hooks: ["plumes.sources:check_gvp_volcanoes"]   # 23 rows, the expected Volcano_Number set
    links:
      - id: wfs-csv
        url: "https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=GVP-VOTW:Smithsonian_VOTW_Holocene_Volcanoes&outputFormat=csv&CQL_FILTER=Country%3D%27Philippines%27"
        probe_size: false
      - id: wfs-geojson
        url: "https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=GVP-VOTW:Smithsonian_VOTW_Holocene_Volcanoes&outputFormat=json&CQL_FILTER=Country%3D%27Philippines%27"
        automatic: false                   # same rows as GeoJSON: a different container
        probe_contains: "FeatureCollection"
      - id: archive
        archive: true
    checks:
      bytes: { min: 10000, max: 2000000 }
      rows: { min: 20, max: 40 }
      required_columns: [Volcano_Number, Volcano_Name, Latitude, Longitude, Elevation, Last_Eruption_Year]
      profile: { key: Volcano_Number, numeric: [Latitude, Longitude, Elevation] }
    archived: { enabled: true, retention: all, max_age_days: 400 }

  - id: gvp-eruptions-ph
    # chosen: true   # source 2 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] Smithsonian GVP Holocene eruptions for the Philippine volcano numbers (271000-274999; 233 rows on
      2026-10-21): VEI, start and end dates with explicit uncertainty fields and modifiers, evidence method.
      Becomes the episode table (DATA-PLAN.md §4), shown with the citation. Access: the same WFS, eruptions layer.
      Format: CSV. Size: under 200 kB. Auth: none.
    kind: file
    format: csv
    filename: gvp-eruptions-ph.csv
    local_path: data/raw/gvp/gvp-eruptions-ph.csv
    licence: "open-with-conditions: Smithsonian Terms of Use (non-commercial use with citation; see gvp-volcanoes-ph)"
    attribution: >-
      Global Volcanism Program, 2026. [Database] Volcanoes of the World (v. 5.4.0; 7 Aug 2026). Distributed by
      Smithsonian Institution, compiled by Venzke, E. https://doi.org/10.5479/si.GVP.VOTW5-2026.5.4
    cadence: database releases a few times a year; recent eruptions updated continuously
    hooks: ["plumes.sources:check_gvp_eruptions"]   # every Volcano_Number exists in gvp-volcanoes-ph; VEI in 0-8 or blank
    links:
      - id: wfs-csv
        url: "https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=GVP-VOTW:Smithsonian_VOTW_Holocene_Eruptions&outputFormat=csv&CQL_FILTER=Volcano_Number%20BETWEEN%20271000%20AND%20274999"
        probe_size: false
      - id: archive
        archive: true
    checks:
      bytes: { min: 20000, max: 5000000 }
      rows: { min: 200, max: 400 }
      required_columns: [Volcano_Number, Volcano_Name, Eruption_Number, ExplosivityIndexMax, StartDateYear, EndDateYear]
      shrink_tolerance: 0.02
      profile: { key: Eruption_Number, group: Volcano_Number, numeric: [StartDateYear, ExplosivityIndexMax] }
    archived: { enabled: true, retention: all, max_age_days: 400 }

  # ------------------------------------------------------------------ thermal: MIROVA Dataset v2.5 (OSF, CC BY 4.0)
  - id: mirova-vrp
    description: >-
      [M1] MIROVA Dataset v2.5 (MODIS + VIIRS 2000-2025), University of Turin, VRP_GLOBAL_ARCHIVE_2025.csv
      (98,625,213 bytes on 2026-10-21) from OSF project zm62w (DOI 10.17605/OSF.IO/ZM62W). Global volcanic radiative
      power detections; the pipeline keeps the Philippine volcanoes (Taal, Mayon, Kanlaon, Pinatubo are listed; the
      subset is checked by a hook). Schema: MIROVA_Database_Schema_v2.5.docx in the same folder (spike item 9).
      Access: OSF download. Format: CSV. Size: 98.6 MB global; the Philippine subset is about 1 MB [U]. Auth: none.
    kind: file
    format: csv
    filename: mirova-vrp-global-2025.csv
    local_path: data/raw/mirova/mirova-vrp-global-2025.csv
    licence: "open: CC BY 4.0 (OSF project licence 'CC-By Attribution 4.0 International', read from the OSF API on 2026-10-21); the MIROVA website's non-commercial terms are not used"
    attribution: >-
      MIROVA Dataset v2.5, University of Turin (Coppola, D. et al.), https://osf.io/zm62w/ (DOI 10.17605/OSF.IO/ZM62W);
      MIROVA system: Coppola et al. 2020, Frontiers in Earth Science 7, doi:10.3389/feart.2019.00362
    cadence: yearly dataset releases
    pin: { version: "v2.5", osf_file: "53zwm", osf_modified: "2026-08-19" }
    hooks: ["plumes.sources:check_mirova"]           # Philippine GVP numbers present; dates parse
    links:
      - id: osf-download
        url: "https://osf.io/download/53zwm/"        # 302 to files.osf.io (https)
        probe_size: false
      - id: archive
        archive: true
    checks:
      bytes: { min: 50000000, max: 300000000 }
      rows: { min: 200000, max: 20000000 }
      shrink_tolerance: 0.02
    archived: { enabled: true, retention: all, max_age_days: 400 }

  # ------------------------------------------------------------------ earthquakes: USGS ComCat (public domain)
  - id: usgs-comcat-ph-1900-2009
    # chosen: true   # source 5 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] USGS ComCat events in the Philippine box (4-22 N, 116-128 E) 1900-01-01 to 2009-12-31 as FDSN CSV
      (15,738 events on 2026-10-21; the service caps a query at 20,000). Pre-1970 rows are mostly ISC-GEM imports.
      Access: earthquake.usgs.gov/fdsnws/event/1/query. Format: CSV. Size: about 3 MB. Auth: none.
    kind: file
    format: csv
    filename: usgs-comcat-ph-1900-2009.csv
    local_path: data/raw/usgs/usgs-comcat-ph-1900-2009.csv
    licence: "open: U.S. public domain (USGS-authored data); credit U.S. Geological Survey"
    attribution: "U.S. Geological Survey, ANSS Comprehensive Earthquake Catalog (ComCat), https://earthquake.usgs.gov/data/comcat/"
    cadence: rarely changes (catalogue revisions); re-fetched quarterly
    hooks: ["plumes.sources:check_usgs"]             # magnitude types; times parse; box respected
    links:
      - id: fdsn-csv
        url: "https://earthquake.usgs.gov/fdsnws/event/1/query?format=csv&starttime=1900-01-01&endtime=2009-12-31&minlatitude=4&maxlatitude=22&minlongitude=116&maxlongitude=128&orderby=time-asc"
        probe: "https://earthquake.usgs.gov/fdsnws/event/1/count?format=text&starttime=1900-01-01&endtime=2009-12-31&minlatitude=4&maxlatitude=22&minlongitude=116&maxlongitude=128"
        probe_size: false
      - id: archive
        archive: true
    checks:
      bytes: { min: 2000000, max: 20000000 }
      rows: { min: 14000, max: 20000 }
      required_columns: [time, latitude, longitude, depth, mag, magType, id, place, type, status]
      shrink_tolerance: 0.02
      profile: { key: id, numeric: [latitude, longitude, depth, mag] }
    archived: { enabled: true, retention: all }

  - id: usgs-comcat-ph-2010
    # chosen: true   # source 5 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] USGS ComCat events in the Philippine box from 2010-01-01 to the fetch date as FDSN CSV (11,594 events on
      2026-10-21). Split from the 1900-2009 file so both stay under the 20,000-event cap; a yearly split is
      added when this one approaches 18,000. Format: CSV. Size: about 2 MB, growing. Auth: none.
    kind: file
    format: csv
    filename: usgs-comcat-ph-2010.csv
    local_path: data/raw/usgs/usgs-comcat-ph-2010.csv
    licence: "open: U.S. public domain (USGS-authored data); credit U.S. Geological Survey"
    attribution: "U.S. Geological Survey, ANSS Comprehensive Earthquake Catalog (ComCat), https://earthquake.usgs.gov/data/comcat/"
    cadence: weekly (new events; revisions within months)
    hooks: ["plumes.sources:check_usgs"]
    links:
      - id: fdsn-csv
        url: "https://earthquake.usgs.gov/fdsnws/event/1/query?format=csv&starttime=2010-01-01&minlatitude=4&maxlatitude=22&minlongitude=116&maxlongitude=128&orderby=time-asc"
        probe: "https://earthquake.usgs.gov/fdsnws/event/1/count?format=text&starttime=2010-01-01&minlatitude=4&maxlatitude=22&minlongitude=116&maxlongitude=128"
        probe_size: false
      - id: archive
        archive: true
    checks:
      bytes: { min: 1500000, max: 20000000 }
      rows: { min: 10000, max: 20000 }
      required_columns: [time, latitude, longitude, depth, mag, magType, id, place, type, status]
      shrink_tolerance: 0.02
      profile: { key: id, numeric: [latitude, longitude, depth, mag] }
    anomaly: { max_row_change: 0.3 }               # a big aftershock sequence can add thousands of rows in a week
    archived: { enabled: true, retention: all, max_age_days: 60 }

  # ------------------------------------------------------------------ boundaries and codes (shared with Lights and Replay)
  - id: cod-ab-phl-gdb
    # chosen: true   # source 14 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] OCHA/NAMRIA/PSA Common Operational Dataset, Philippines administrative boundaries levels 0-4 (v03, file
      geodatabase, about 361 MB; HDX resources modified 2026-05-28). Used for "LGUs within N km" and the map
      boundaries; the same file Lights uses (../../lgu-lights/pipeline/sources.yaml). Decided (Q30): the pipeline reads
      only the member phl_admin3.dbf of the hdx-shp zip by HTTP range (119,401 bytes: 1,642 LGUs with adm3_pcode,
      names, area, centre); the gdb entry below stays until the range-read hook replaces it (spike item 21).
      Format: zip (gdb). Auth: none.
    kind: file
    format: zip
    filename: phl_admin_boundaries.gdb.zip
    local_path: data/raw/boundaries/phl_admin_boundaries.gdb.zip
    licence: "open-with-conditions: Creative Commons Attribution for Intergovernmental Organisations (CC BY-IGO)"
    attribution: "OCHA Philippines, Philippines - Subnational Administrative Boundaries (COD-AB), source NAMRIA and PSA, https://data.humdata.org/dataset/philippines-administrative-levels-0-to-3"
    cadence: yearly review
    links:
      - id: hdx
        url: https://data.humdata.org/dataset/caf116df-f984-4deb-85ca-41b349d3f313/resource/3fa0dbcf-e07d-4506-9821-ba15baa6da07/download/phl_admin_boundaries.gdb.zip
      - id: hdx-shp
        url: https://data.humdata.org/dataset/caf116df-f984-4deb-85ca-41b349d3f313/resource/4e4067d6-3fc8-4d2c-91ea-330c3d4f8e8e/download/phl_admin_boundaries.shp.zip
        automatic: false                   # the same boundaries as shapefiles: a different container
      - id: archive
        archive: true
    pin: { version: v03, hdx_last_modified: "2026-05-28" }
    checks:
      bytes: { min: 200000000, max: 800000000 }
      zip_member: "*.gdb/gdb"
    archived: { enabled: true, retention: all, max_age_days: 400 }

  - id: psgc-cities-municipalities
    description: >-
      [M1] Philippine Statistics Authority, Philippine Standard Geographic Code: cities and municipalities with the
      9- and 10-digit codes, the one key joining every barangay and LGU table (shared with Lights and Replay,
      ../../typhoon-replay/pipeline/sources.yaml). psa.gov.ph answers 403 to scripts, so the community JSON mirror is
      the automatic link (last modified 2022-08-27, stale for post-2023 changes) and the official quarterly xlsx is
      downloaded by hand and adopted as an archive release. Format: JSON. Size: about 1 MB. Auth: none.
    kind: file
    format: json
    filename: psgc-cities-municipalities.json
    local_path: data/raw/boundaries/psgc-cities-municipalities.json
    licence: "open: PSA public data (free use with attribution; the PSGC page itself was not readable by scripts on 2026-10-21, LICENCES.md)"
    attribution: "Philippine Standard Geographic Code (PSGC), Philippine Statistics Authority; JSON via the PSGC API (psgc.gitlab.io)"
    cadence: quarterly PSA releases
    links:
      - id: psgc-gitlab-api
        url: https://psgc.gitlab.io/api/cities-municipalities.json
      - id: archive
        archive: true
      - id: psa-psgc
        url: https://psa.gov.ph/classification/psgc
        probe_html: true
        automatic: false                   # PSA publication page (xlsx links); answers 403 to scripts
    checks:
      bytes: { min: 200000, max: 2000000 }
      rows: { min: 1550, max: 1750 }
      json_type: array
    archived: { enabled: true, retention: all }

  # ------------------------------------------------------------------ PHIVOLCS pages (crawled by the pipeline; DATA-PLAN.md §3, Q5 = ii)
  - id: phivolcs-bulletins
    # chosen: true   # source 3 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] DOST-PHIVOLCS daily volcano bulletins and eruption bulletins on the WordPress site: HTML prose from
      2017-09-02 (category listing paginates to page 1,498 on 2026-10-21); 2025+ "Summary of 24Hr Observation"
      posts have empty bodies and are covered by phivolcs-lava-bulletins instead. Crawled at <= 1 request/s by the
      pipeline's own client; raw HTML bundles are adopted as private archive releases (phivolcs-bulletins-<date>).
      Parsed fields: alert level, volcanic earthquake counts and types, SO2 flux (t/day) with its date, plume,
      crater-lake temperature, deformation statement. Every value is shown with its bulletin URL as a dated marker;
      no bulk file is published. Format: HTML. Size: about 15,000 pages, 300 MB [U]. Auth: none.
    kind: update-input
    licence: >-
      link-only in the canvas sense (cite every figure with its link; no bulk file). No terms stated on the site;
      work of the Government of the Philippines (RA 8293 s.176.1: no copyright; prior approval needed only for
      exploitation for profit).
    attribution: "DOST-PHIVOLCS (Philippine Institute of Volcanology and Seismology), volcano bulletins, https://www.phivolcs.dost.gov.ph/"
    cadence: daily for volcanoes with observatories (Taal, Mayon, Kanlaon, Bulusan; others during unrest)
    links:
      - id: category-listing
        url: "https://www.phivolcs.dost.gov.ph/category/volcano-bulletin/"
        probe_html: true
        probe_contains: "VOLCANO"
      - id: example-bulletin
        url: "https://www.phivolcs.dost.gov.ph/taal-volcano-bulletin-14-march-2022-8-00-am/"
        probe_html: true
        probe_contains: "tonnes/day"
    archived: { enabled: false }            # raw bundles are adopted per crawl by the pipeline (not fetched by the kit)

  - id: phivolcs-lava-bulletins
    # chosen: true   # source 4 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] DOST-PHIVOLCS LAVA portal 24-hour volcano bulletins, structured HTML by id
      (/bulletin/activity-{tvo,mvo,kvo,bvo}?bid=N&lang=en; id 1000 = 2022-04-02, id 16917 = 2026-10-21; ids are not
      contiguous). Public pages only: the portal's registered datasets are not used (data policy of 2020-07-01:
      cite DOST-PHIVOLCS; no redistribution; no public forecasting). Crawled at <= 1 request/s; raw bundles
      adopted as private archive releases. The portal's TLS chain fails verification in some clients.
      Format: HTML. Size: about 7,000 pages, 15 kB each [U]. Auth: none.
    kind: update-input
    licence: >-
      link-only in the canvas sense. The LAVA data policy governs registered downloads, which are not used; public
      bulletin pages are government works (RA 8293 s.176.1). Displayed with citation; no bulk file.
    attribution: "DOST-PHIVOLCS, Local Active Volcanoes Archive (LAVA), https://wovodat.phivolcs.dost.gov.ph/"
    cadence: daily per monitored volcano
    links:
      - id: list
        url: "https://wovodat.phivolcs.dost.gov.ph/bulletin/list-of-bulletin"
        probe_html: true
        probe_contains: "activity-tvo"
      - id: example-bulletin
        url: "https://wovodat.phivolcs.dost.gov.ph/bulletin/activity-tvo?bid=16917&lang=en"
        probe_html: true
        probe_contains: "Sulfur Dioxide Flux"
    archived: { enabled: false }

  - id: phivolcs-earthquakes
    description: >-
      [M1.1] DOST-PHIVOLCS earthquake information: monthly HTML tables from 2016 with gaps
      (/EQLatest-Monthly/YYYY/YYYY_Month.html, 0.5-2.8 MB each, about 1,450 events a month in 2025) with date-time
      (PHT), latitude, longitude, depth, magnitude, location; magnitude type on the per-event page. Crawled monthly
      by the pipeline; raw pages adopted as private archive releases. Used for per-volcano counts within 30 km;
      no national table is published. Format: HTML. Size: about 130 pages, 200 MB, 150k rows [U]. Auth: none.
    kind: update-input
    licence: "link-only in the canvas sense: no terms stated; government work (RA 8293 s.176.1); displayed with citation; no bulk file"
    attribution: "DOST-PHIVOLCS, Earthquake Information, https://earthquake.phivolcs.dost.gov.ph/"
    cadence: continuous; monthly pages rebuilt
    links:
      - id: latest
        url: "https://earthquake.phivolcs.dost.gov.ph/"
        probe_html: true
        probe_contains: "LATEST EARTHQUAKE INFORMATION"
      - id: monthly-example
        url: "https://earthquake.phivolcs.dost.gov.ph/EQLatest-Monthly/2025/2025_January.html"
        probe_html: true
        probe_contains: "Date - Time"
    archived: { enabled: false }

  # ------------------------------------------------------------------ satellite rasters on Earth Engine (never downloaded or archived)
  - id: s5p-offl-so2
    # chosen: true   # source 6 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] Copernicus / ESA Sentinel-5P TROPOMI offline L3 SO2 (COPERNICUS/S5P/OFFL/L3_SO2), 2018-12-05 onward,
      1,113 m, one image per orbit; bands SO2_column_number_density (ground-level a priori),
      SO2_column_number_density_15km, cloud_fraction. Reduced in Earth Engine to daily column mass and valid-pixel
      fraction per volcano box and ring, and to monthly national mean mosaics (DATA-PLAN.md §2). Access: Earth Engine.
      Format: EE ImageCollection; outputs CSV and GeoTIFF. Size: about 2,900 days x 24 volcanoes of rows (under 5 MB);
      95 monthly mosaics under 1 MB each [U]. Auth: Earth Engine service account.
    kind: remote-dataset
    licence: "open: Copernicus Sentinel Data Legal Notice (free, full and open; reproduction, distribution, adaptation permitted); Earth Engine used under its noncommercial terms"
    attribution: "Contains modified Copernicus Sentinel data [Year], processed by ESA; TROPOMI SO2 retrieval Theys et al. 2017 (doi:10.5194/amt-10-119-2017). Processed in Google Earth Engine."
    cadence: daily (OFFL latency about a week)
    links:
      - id: earth-engine
        url: ee://COPERNICUS/S5P/OFFL/L3_SO2
        probe: https://earthengine-stac.storage.googleapis.com/catalog/COPERNICUS/COPERNICUS_S5P_OFFL_L3_SO2.json
        probe_contains: "L3_SO2"
      - id: earth-engine-nrti
        url: ee://COPERNICUS/S5P/NRTI/L3_SO2
        probe: https://earthengine-stac.storage.googleapis.com/catalog/COPERNICUS/COPERNICUS_S5P_NRTI_L3_SO2.json
        probe_contains: "L3_SO2"
    archived: { enabled: false }

  - id: firms-modis
    # chosen: true   # source 8 of 24, M1 (DECISIONS.md Q30)
    description: >-
      [M1] NASA FIRMS (LANCE) MODIS active fire and thermal anomalies on Earth Engine (collection FIRMS, 1 km daily,
      2000-11-01 onward; bands T21, confidence). Counted per volcano ring and day as "thermal detections (includes
      vegetation fires)". Decided (Q30): the national detections layer comes from the FIRMS area API
      (.../api/area/csv/<MAP_KEY>/{MODIS_SP,VIIRS_SNPP_SP}/116,4,128,22/5/<date>, 5 days per call) instead of the
      emailed archive download; whether the SP CSV carries `type` (1 = active volcano) is spike item 19. The API needs a free MAP_KEY
      (Kurt's action; GitHub secret FIRMS_MAP_KEY; 5,000 transactions per 10 minutes). Format: EE; CSV. Size: a
      Philippine-box VIIRS day is 50-500 kB [U]; a volcano-month under 100 kB [U]. Auth: Earth Engine service account; MAP_KEY.
